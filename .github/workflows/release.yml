name: Release

on:
  workflow_dispatch:

jobs:
  release:
    # Self-hosted runner (same as CI in swift.yml) — GitHub-hosted macOS runners
    # are billed and were blocked by an account spending limit.
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Read MARKETING_VERSION from Xcode project
        id: version
        run: |
          VERSION=$(awk -F' = ' '/MARKETING_VERSION/{gsub(/[; ]/,"",$2); print $2; exit}' TrailMate.xcodeproj/project.pbxproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./packaging/release.sh

      - name: Create release and upload DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            "build/TrailMate-$VERSION.dmg" \
            --title "v$VERSION" \
            --generate-notes
