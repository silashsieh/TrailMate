# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6
    - name: Cache python-build-standalone download
      uses: actions/cache@v5
      with:
        path: packaging/.cache
        key: pbs-${{ hashFiles('packaging/build.sh') }}
    - name: Build
      run: ./packaging/release.sh

  test:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6
    - name: Cache python-build-standalone download
      uses: actions/cache@v5
      with:
        path: packaging/.cache
        key: pbs-${{ hashFiles('packaging/build.sh') }}
    # The app's Resources phase copies PythonResources/ into the bundle, and
    # the unit tests are hosted in TrailMate.app — so the test build needs the
    # bundled Python runtime even though no test exercises it.
    - name: Build PythonResources
      run: ./packaging/build.sh
    - name: Run unit tests
      run: |
        mkdir -p build
        xcodebuild test \
          -project TrailMate.xcodeproj \
          -scheme TrailMate \
          -destination 'platform=macOS' \
          -skip-testing:TrailMateUITests \
          -resultBundlePath build/TestResults.xcresult \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO
    # Upload the parent dir so the .xcresult wrapper directory survives the
    # zip round-trip (upload-artifact roots the artifact at the matched path).
    - name: Upload result bundle on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: build

  # UI automation gets its own job so an XCUITest/TCC flake never taints the
  # unit-test signal.
  ui-test:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6
    - name: Cache python-build-standalone download
      uses: actions/cache@v5
      with:
        path: packaging/.cache
        key: pbs-${{ hashFiles('packaging/build.sh') }}
    - name: Build PythonResources
      run: ./packaging/build.sh
    - name: Run UI tests
      run: |
        mkdir -p build
        xcodebuild test \
          -project TrailMate.xcodeproj \
          -scheme TrailMate \
          -destination 'platform=macOS' \
          -only-testing:TrailMateUITests \
          -resultBundlePath build/UITestResults.xcresult \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY=- \
          CODE_SIGNING_REQUIRED=NO
    - name: Upload result bundle on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ui-test-results
        path: build
