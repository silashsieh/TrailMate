name: Bug report / 問題回報
description: Something doesn't work as expected. / 功能不如預期。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! 中英文皆可。For project-management questions, see the
        [process doc](../blob/main/docs/project-plan/process.md) instead — issues are a
        bug/feature inbox, not the planning system.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened? / 發生了什麼？
      description: What you saw, and what you expected instead. / 實際行為與預期行為。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: false
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: TrailMate version, macOS version, iOS version. / App、macOS、iOS 版本。
      placeholder: "TrailMate 1.2.0 · macOS 26.4 · iOS 26.4"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output / 記錄輸出
      description: Relevant lines from the Log sheet (View Full Log). / Log sheet 的相關內容。
      render: text
    validations:
      required: false
